<!-- Image Preview -->

    <img id="viewerImage">

<!-- Video Preview -->

<div id="videoViewer">

    <span id="closeVideo">×</span>

    <video id="viewerVideo" controls></video>

</div>

<body>

<div id="loader">

    

    <div class="loader-box">

        <h1>❤️ Just For You Tiya ❤️</h1>

        <p id="loadingText">Preparing Your Surprise...</p>

        <div class="loading-bar">
            <div class="loading-fill"></div>
        </div>

    </div>

</div>

<div id="scrollProgress"></div>

    <!-- Floating Hearts -->
    <div id="hearts"></div>

    <!-- Hero Section -->
    <section id="hero">

        <div class="hero-card">

            <h1>
                Happy Birthday
                <span> Tiya ❤️</span>
            </h1>

            <p>
                Every moment with you is my favorite memory. ✨
            </p>

            <div id="timer">
                Loading...
            </div>

            <button id="startBtn">
                🎵 Start The Celebration
            </button>

<p id="celebrateMsg"></p>

        </div>

    </section>

    <!-- Memories -->
    <section id="memories">

        <h2>Our Beautiful Memories ❤️</h2>

        <div class="gallery">

            <img src="assets/image/5efc3a19d097508c3e06e07d35551f0c.jpg">
            <img src="assets/image/6efa3fdbbe23704c0046f3fa3d74d3a2.jpg">
            <img src="assets/image/7261a6cbd64e49a205448b4f641cc6c0.jpg">
            <img src="assets/image/80ccb750ecfdda2b5edaea8a5f0359b3.jpg">
            <img src="assets/image/a7a34f5ab14401588effd52923aa8db9.jpg">
            <img src="assets/image/A perfect hug is, When somebody hugs you directly….jpg">
             
            



        </div>

    </section>




<section id="cakeSection" class="reveal">

    <h2>Make A Wish ❤️</h2>

    <div id="cakeBox">

        <div id="knife"></div>

        <div id="cake">

            <div class="cut-line"></div>

            <div class="cake-part left"></div>
            <div class="cake-part right"></div>

            <div class="cream"></div>

            <div class="cherry"></div>

            <div class="candles">

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

            </div>

        </div>

    </div>

    <button id="cutCake">
        🎂 Cut The Cake
    </button>

</section>


<section id="letter">

    <h2 class="letter-title">
        💌 A Letter For You ❤️
    </h2>

</section>


<section>


    <div class="envelope" id="envelope">

        <div class="cover"></div>

        <div class="letter-paper">

            <h3>My Love ❤️</h3>

            <p id="loveText"></p>

        </div>

    </div>

    <button id="openLetter">💖 Open My Letter</button>

</section>
